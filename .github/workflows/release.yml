name: Upload Pyearth Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/pyearth
    permissions:
      id-token: write  # Enables PyPI Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install cython numpy build twine

      - name: Verify version matches git tag
        run: |
          PACKAGE_VERSION=$(grep '^version = ' pyproject.toml | cut -d '"' -f 2)
          echo "Package version in pyproject.toml: $PACKAGE_VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "Release tag: $TAG_VERSION"
            if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Version mismatch! pyproject.toml is $PACKAGE_VERSION but git tag is $TAG_VERSION"
              exit 1
            fi
          fi

      - name: Build package distribution (sdist)
        run: python -m build --sdist

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Upload dist artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: pyearth-dist
          path: dist/
          retention-days: 7

      - name: Publish to PyPI
        if: "!github.event.release.prerelease"
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYEARTH_PYPI }}
