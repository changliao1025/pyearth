name: CI Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pyearth-test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
              - nodefaults
          create-args: >-
            python=${{ matrix.python-version }}
            numpy
            cython
            gdal
            netcdf4
            pandas
            scipy
            statsmodels
            rtree
            geographiclib
            pytest
            pytest-cov
            wheel
            setuptools
          cache-environment: true
          cache-environment-key: micromamba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Build Cython Extensions
        shell: bash -el {0}
        run: |
          python setup.py build_ext --inplace
          pip install --no-build-isolation --no-deps -e .

      - name: Run Test Suite
        shell: bash -el {0}
        run: |
          pytest -ra -v --cov=pyearth --cov-report=xml tests/

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
